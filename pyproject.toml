[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-toolkit"
version = "0.1.0"
description = "本地音乐文件格式识别与转码框架（学习用途）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Music Toolkit Contributors" }]
keywords = ["audio", "format-detection", "ffmpeg", "tkinter"]
dependencies = [
    "ttkbootstrap==1.10.1",
    "tkinterdnd2>=0.4.2",
    "mutagen>=1.47",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
ffmpeg = [
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
music-toolkit = "music_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:ttkbootstrap.*",
]

[tool.coverage.run]
source = ["music_toolkit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM105", "SIM115"]
